<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: 'foto' }} · {{ site.title }}</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>

<div class="page-wrap">

  {% include masthead.html %}

  <div class="home-columns">

    {% include nav-coluna.html %}

    <main class="home-main">
      <article class="item-post">
        <p class="data-post">{{ page.date | date: "%d de %B, %Y" }}</p>
        <img src="{{ page.image | relative_url }}" alt="{{ page.alt | default: '' }}" class="foto-grande">
        <div class="corpo-post">{{ content }}</div>
      </article>

      <p class="link-continuar"><a href="{{ '/galeria/' | relative_url }}">&larr; voltar pra galeria</a></p>
    </main>

  </div>

</div>

</body>
</html>
