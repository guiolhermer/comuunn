title: comuunn 
tagline: "there's electricity in the air and you can almost hear it" 
description: | 
  Este é um espaço para eu observar a entrelinha da vida cotidiana. Quando eu era mais jovem, naturalmente a vida atingia meu coração através dos olhos e eu escrevia para, de alguma forma, manter aquela imagem fugaz registrada. Com a vida adulta, essa sensibilidade foi perdida. E eu nunca deixei de ser um(a) maldito(a) adulto(a).
  
  Escrever estas linhas de código é a minha tentativa de restaurar a sensibilidade artística medíocre que eu já tive. Então, alguns fatos sobre mim. Tenho 27 anos, sou professor(a) de inglês como segunda língua, completando 28 anos este ano, e há alguns dias decidi que não é mais hora de adiar esse desejo estranho e sem nome de escrever.
  
  Aqui você encontrará uma coleção dos meus dias e algumas tentativas de capturar imagens e montagens de eventos da minha rotina que acho interessantes, mas que não tinham — até agora — um lugar para serem colocados. Como uma galeria do que acho interessante. Isso inclui insetos apenas vivendo, luzes e sombras divertidas, ângulos, cores, texturas, pessoas, situações e tantas outras coisas.
  
  Minha esperança é criar um espaço onde eu possa compartilhar meus pensamentos e sentimentos sobre o mundo ao meu redor, e talvez até me conectar com outras pessoas que conseguem ver a beleza subtil de meras trifles (coisas insignificantes).
  
  Acho que vou alternar entre inglês e português.
  
  <b>Por que este site é todo em preto e branco?</b>
  
  A resposta simples é porque tenho medo de explorar minha identidade virtual. Não sei do que gosto, então quero me concentrar no conteúdo e depois vou brincar com as texturas, fundos e assim por diante.
  
  Basicamente é isso. Se você quiser saber mais sobre mim, clique em "Sobre mim" à sua esquerda.
  
  Obrigado(a) por vir.


