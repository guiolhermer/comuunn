<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>guestbook · {{ site.title }}</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Handjet:wght,ELSH@100..900,2&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>

<div class="page-wrap">

  {% include masthead.html %}

  <div class="home-columns">

    {% include nav-coluna.html %}

    <div class="guestbook-content">

      <!-- Guestbook Script -->
      <script async src="https://guestbooks.meadow.cafe/resources/js/embed_script/6533/script.js"></script>

      <!-- Guestbook Form -->
      <div id="guestbooks___guestbook-form-container">
        <form id="guestbooks___guestbook-form"
                action="https://guestbooks.meadow.cafe/guestbook/6533/submit"
                method="post">
            <div class="guestbooks___input-container">
                <input type="text"
                    id="name"
                    name="name"
                    placeholder="your name"
                    required>
            </div>
            <div class="guestbooks___input-container">
            <input type="url"
                    id="website"
                    name="website"
                    placeholder="Website (optional)">
            </div>
            <div id="guestbooks___challenge-answer-container"></div>
            <div class="guestbooks___input-container">
            <textarea id="text"
                        name="text"
                        placeholder="leave your message here..."
                        rows="4"
                        style="width: 100%; box-sizing: border-box; resize: vertical;"
                        required></textarea>
            </div>
            <div id="guestbooks___pow-status"></div>
            <button type="submit">Sign Guestbook</button>
            <div id="guestbooks___error-message"></div>
        </form>
      </div>

      <!-- Attribution (optional but appreciated!) -->
      <div id="guestbooks___guestbook-made-with" style="text-align: right; margin-top: 10px;">
        <small>Powered by <a href="https://guestbooks.meadow.cafe" target="_blank">Guestbooks</a></small>
      </div>

      <!-- Messages Section -->
      <hr style="margin: 2em 0;"/>
      <h3 id="guestbooks___guestbook-messages-header">Messages</h3>
      <div id="guestbooks___guestbook-messages-container"></div>

    </div>

  </div>

</div>

</body>
</html>
